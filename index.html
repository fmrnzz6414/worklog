<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- セキュリティ設定：外部との通信・外部ファイルの読み込みをすべて禁止しています -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>きょうの業務ログ</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#667085;--line:#e3e6eb;
  --accent:#2f6fed;--accent-soft:#e8effd;--danger:#d92d20;--warn-bg:#fff6e5;--warn:#9a5b00;--radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111418;--card:#1a1f26;--text:#e8eaed;--muted:#9aa4b2;--line:#2b323c;
  --accent:#6b9bff;--accent-soft:#1e2a44;--danger:#ff6b5e;--warn-bg:#3a2c10;--warn:#ffcf7a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:0 auto;padding:10px 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h2{margin:0}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.empty{color:var(--muted);margin:4px 0}
.muted{color:var(--muted)}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.icon{padding:6px 10px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=color]{padding:2px;width:42px;height:36px}
textarea{width:100%;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 200px}
.datenav{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.datelabel{font-size:17px;min-width:170px;text-align:center}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.catbtn{position:relative;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:14px 12px;cursor:pointer;min-height:56px}
.catbtn:hover{border-color:var(--c)}
.catbtn .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.catbtn .name{flex:1;font-weight:600}
.catbtn kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:inherit}
.catbtn.active{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.running{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--card));border-radius:10px;padding:12px;margin-bottom:12px}
.runhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--c);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.elapsed{margin-left:auto;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.loglist{display:flex;flex-direction:column}
.logrow{display:grid;grid-template-columns:110px auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.time,.dur{font-variant-numeric:tabular-nums}
.dur{color:var(--muted);text-align:right;min-width:70px}
.memo{color:var(--text);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.total{font-size:22px;font-weight:700;margin:0 0 8px}
.chart{width:100%;height:auto;display:block}
.chart .lbl{font-size:13px;fill:var(--text)}
.chart .val{font-size:12px;fill:var(--muted)}
.chart .axis{font-size:13px;fill:var(--muted)}
.chart .grid{stroke:var(--line)}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{padding:6px 8px;border-top:1px solid var(--line);text-align:left}
table.sum td.num{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 14px;cursor:pointer;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.catedit{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.catedit:first-of-type{border-top:0}
.catedit label{font-size:13px;color:var(--muted);white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--text);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px;font-size:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field span{font-size:13px;color:var(--muted)}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dlgbtns .left{margin-right:auto}
footer{color:var(--muted);font-size:12px;text-align:center;padding:16px}
footer a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.secure{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
@media (max-width:600px){
  .logrow{grid-template-columns:1fr auto;grid-template-areas:"time dur" "chip edit" "memo memo"}
  .logrow .time{grid-area:time}.logrow .dur{grid-area:dur}.logrow .chip{grid-area:chip;justify-self:start}
  .logrow .memo{grid-area:memo}.logrow .btn{grid-area:edit;justify-self:end}
  .tabs{margin-left:0;width:100%}
  .tab{flex:1}
  .datelabel{min-width:0;font-size:15px}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <h1>きょうの業務ログ</h1>
    <span class="secure" title="このページは外部と一切通信しません">🔒 外部通信なし・データはこの端末だけに保存</span>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today">今日</button>
      <button class="tab" role="tab" data-tab="stats">集計</button>
      <button class="tab" role="tab" data-tab="settings">設定</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ===== 設定（公開時に書き換えてください） ===== */
const PROMO = { url: '', label: '高機能版はこちら' };   // 例: BOOTHの商品ページURL。空なら表示しません
const VERSION = '1.0.0';

/* ===== 保存 ===== */
const STORE_KEY = 'gyomu-log:v1';
const PALETTE = ['#4f7cf7','#16a34a','#f59e0b','#8b5cf6','#ec4899','#64748b','#94a3b8','#0ea5e9','#ef4444','#14b8a6','#a16207','#6366f1'];
const DEFAULT_CATS = [
  {id:'c1',name:'会議',color:'#4f7cf7',exclude:false},
  {id:'c2',name:'資料作成',color:'#16a34a',exclude:false},
  {id:'c3',name:'メール・連絡',color:'#f59e0b',exclude:false},
  {id:'c4',name:'集計・分析',color:'#8b5cf6',exclude:false},
  {id:'c5',name:'顧客対応',color:'#ec4899',exclude:false},
  {id:'c6',name:'移動',color:'#64748b',exclude:false},
  {id:'c7',name:'休憩',color:'#94a3b8',exclude:true},
  {id:'c8',name:'その他',color:'#0ea5e9',exclude:false}
];

function freshState(){ return {version:1, categories:DEFAULT_CATS.map(c=>({...c})), entries:[], running:null}; }
function sanitize(s){
  if(!s || typeof s!=='object' || !Array.isArray(s.categories) || !Array.isArray(s.entries)) return null;
  const color = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#888888';
  const categories = s.categories.filter(c=>c && typeof c.id==='string').map(c=>({
    id:c.id.slice(0,40), name:String(c.name||'無題').slice(0,40), color:color(c.color), exclude:!!c.exclude
  }));
  const entries = s.entries.filter(e=>e && Number.isFinite(e.start) && Number.isFinite(e.end) && e.end>e.start).map(e=>({
    id:String(e.id||uid()).slice(0,40), cat:String(e.cat).slice(0,40), start:e.start, end:e.end, memo:String(e.memo||'').slice(0,200)
  }));
  let running = null;
  if(s.running && Number.isFinite(s.running.start)) running = {cat:String(s.running.cat), start:s.running.start, memo:String(s.running.memo||'').slice(0,200)};
  return {version:1, categories: categories.length?categories:DEFAULT_CATS.map(c=>({...c})), entries, running};
}
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const s = sanitize(JSON.parse(raw)); if(s) return s; } }catch(e){}
  return freshState();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存できませんでした。ブラウザの設定（プライベートモード等）を確認してください'); }
}

let state = load();
const view = { tab:'today', date: todayStr(), period:'week', offset:0 };

/* ===== 小道具 ===== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); }
const WD = ['日','月','火','水','木','金','土'];
function fmtDateJ(s){ const d=parseDate(s); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${WD[d.getDay()]}）`; }
function fmtMD(s){ const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtTime(ms){ const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDur(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h ? (m?`${h}時間${m}分`:`${h}時間`) : `${m}分`; }
function fmtElapsed(ms){ const s=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function durMin(e){ return Math.max(0,(e.end-e.start)/60000); }
function cat(id){ return state.categories.find(c=>c.id===id) || {id, name:'（削除した業務）', color:'#999999', exclude:false}; }
function catIndex(id){ const i=state.categories.findIndex(c=>c.id===id); return i<0?999:i; }

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='value') el.value=v;
    else if(k==='checked') el.checked=!!v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?'':v);
  }
  for(const k of kids.flat()){ if(k==null || k===false) continue; el.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return el;
}
const SVGNS='http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids){
  const el=document.createElementNS(SVGNS, tag);
  for(const [k,v] of Object.entries(attrs||{})) if(v!=null) el.setAttribute(k, v);
  for(const k of kids.flat()){ if(k==null) continue; el.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return el;
}
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function download(name, text, type){
  const blob=new Blob([text],{type}); const a=h('a',{href:URL.createObjectURL(blob), download:name});
  document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました'); return; }catch(e){}
  const ta=h('textarea',{style:'position:fixed;left:-9999px'}); ta.value=text; document.body.append(ta); ta.select();
  try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした。手動で選択してください'); }
  ta.remove();
}

/* ===== 計測 ===== */
function finishRunning(now){
  const r=state.running; if(!r) return;
  if(now-r.start >= 30000) state.entries.push({id:uid(), cat:r.cat, start:r.start, end:now, memo:(r.memo||'').trim()});
  state.running=null;
}
function startCat(id){
  const now=Date.now();
  if(state.running){
    if(state.running.cat===id){ stopRunning(); return; }
    finishRunning(now);
  }
  state.running={cat:id, start:now, memo:''};
  save(); view.date=todayStr(); render();
  const m=document.getElementById('runmemo'); if(m) m.focus();
}
function stopRunning(){ finishRunning(Date.now()); save(); render(); toast('記録しました'); }

function dayEntries(ds, withRunning){
  const list = state.entries.filter(e=>dateStr(new Date(e.start))===ds);
  if(withRunning && state.running && dateStr(new Date(state.running.start))===ds){
    list.push({id:'_run', cat:state.running.cat, start:state.running.start, end:Date.now(), memo:state.running.memo||'', live:true});
  }
  return list.sort((a,b)=>a.start-b.start);
}
function totalsFor(entries){ const m=new Map(); for(const e of entries) m.set(e.cat,(m.get(e.cat)||0)+durMin(e)); return m; }
function workMin(entries){ return entries.filter(e=>!cat(e.cat).exclude).reduce((a,e)=>a+durMin(e),0); }

/* ===== 描画 ===== */
const $app=document.getElementById('app');
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.tab===view.tab)));
  const content = view.tab==='today' ? renderToday() : view.tab==='stats' ? renderStats() : renderSettings();
  $app.replaceChildren(content);
  tick();
}

function renderToday(){
  const f=document.createDocumentFragment();
  const isToday = view.date===todayStr();
  f.append(h('div',{class:'datenav'},
    h('button',{class:'btn icon', title:'前の日', 'aria-label':'前の日', onclick:()=>{view.date=addDays(view.date,-1); render();}},'◀'),
    h('strong',{class:'datelabel'}, fmtDateJ(view.date)),
    h('button',{class:'btn icon', title:'次の日', 'aria-label':'次の日', onclick:()=>{view.date=addDays(view.date,1); render();}},'▶'),
    isToday ? null : h('button',{class:'btn', onclick:()=>{view.date=todayStr(); render();}},'今日に戻る')
  ));

  // 記録する
  const rec=h('section',{class:'card'}, h('h2',{},'記録する'),
    h('p',{class:'hint'},'業務のボタンを押すと計測が始まります。別のボタンを押すと自動で切り替わり、同じボタンをもう一度押すと停止します。数字キー（1〜9）でも操作でき、0キーで停止します。'));
  if(!isToday) rec.append(h('p',{class:'warn'},'ボタンでの記録は「今の時刻」で行われます。過去の日の記録は下の「手入力で追加」を使ってください。'));
  if(state.running) rec.append(renderRunning());
  const grid=h('div',{class:'catgrid'});
  state.categories.forEach((c,i)=>{
    const active = !!(state.running && state.running.cat===c.id);
    grid.append(h('button',{class:'catbtn'+(active?' active':''), style:`--c:${c.color}`, 'aria-pressed':String(active), onclick:()=>startCat(c.id)},
      h('span',{class:'dot'}), h('span',{class:'name'}, c.name), i<9 ? h('kbd',{}, String(i+1)) : null));
  });
  rec.append(grid);
  f.append(rec);

  // 記録一覧
  const list=dayEntries(view.date,false);
  const log=h('section',{class:'card'}, h('div',{class:'cardhead'}, h('h2',{},'記録一覧'), h('button',{class:'btn', onclick:()=>openEntryDialog(null)},'＋ 手入力で追加')));
  if(!list.length) log.append(h('p',{class:'empty'},'まだ記録がありません。'));
  else{
    const box=h('div',{class:'loglist'});
    for(const e of list){
      const c=cat(e.cat);
      box.append(h('div',{class:'logrow'},
        h('span',{class:'time'}, `${fmtTime(e.start)}–${fmtTime(e.end)}`),
        h('span',{class:'chip', style:`--c:${c.color}`}, c.name),
        h('span',{class:'memo'}, e.memo||''),
        h('span',{class:'dur'}, fmtDur(durMin(e))),
        h('button',{class:'btn small', onclick:()=>openEntryDialog(e)},'編集')));
    }
    log.append(box);
  }
  f.append(log);

  // サマリー
  const all=dayEntries(view.date,true);
  const sum=h('section',{class:'card'}, h('h2',{},'この日のまとめ'),
    h('p',{class:'total'}, '実働 ', h('span',{id:'daytotal'}, fmtDur(workMin(all)))),
    h('p',{class:'hint'}, '「合計に含めない」業務（初期設定では休憩）は実働から除いています。'));
  const rows=[...totalsFor(all).entries()].sort((a,b)=>b[1]-a[1]).map(([id,min])=>({label:cat(id).name, color:cat(id).color, min}));
  sum.append(rows.length ? barChart(rows) : h('p',{class:'empty'},'記録するとここにグラフが表示されます。'));
  f.append(sum);

  // 日報
  const ta=h('textarea',{rows:'12', 'aria-label':'日報の文面'}); ta.value=makeReport(view.date);
  f.append(h('section',{class:'card'},
    h('div',{class:'cardhead'}, h('h2',{},'日報の下書き'),
      h('div',{class:'row'},
        h('button',{class:'btn', onclick:()=>{ta.value=makeReport(view.date); toast('作り直しました');}},'作り直す'),
        h('button',{class:'btn primary', onclick:()=>copyText(ta.value)},'コピー'))),
    h('p',{class:'hint'},'記録から自動で作ります。ここで直接書き足してからコピーできます（書き足した内容は保存されません）。'),
    ta));
  return f;
}

function renderRunning(){
  const r=state.running, c=cat(r.cat);
  const long = Date.now()-r.start > 12*3600e3;
  return h('div',{class:'running', style:`--c:${c.color}`},
    h('div',{class:'runhead'},
      h('span',{class:'pulse'}), h('strong',{}, c.name),
      h('span',{class:'muted'}, `${fmtTime(r.start)} から計測中`),
      h('span',{id:'elapsed', class:'elapsed'}, fmtElapsed(Date.now()-r.start))),
    long ? h('p',{class:'warn'},'計測が12時間以上続いています。止め忘れの場合は、停止してから記録一覧で終了時刻を直してください。') : null,
    h('div',{class:'row'},
      h('input',{id:'runmemo', type:'text', class:'grow', maxlength:'200', placeholder:'何をしているか（任意） 例：A社提案書の修正', value:r.memo||'',
        oninput:e=>{ if(state.running){ state.running.memo=e.target.value; save(); } },
        onkeydown:e=>{ if(e.key==='Enter') e.target.blur(); }}),
      h('button',{class:'btn primary', onclick:stopRunning},'停止')));
}

function barChart(rows){
  const max=Math.max(...rows.map(r=>r.min),1), rowH=32, W=640, lw=130, rw=100;
  const svg=s('svg',{viewBox:`0 0 ${W} ${rows.length*rowH+8}`, class:'chart', role:'img', 'aria-label':'業務別の時間'});
  rows.forEach((r,i)=>{
    const y=i*rowH+4, bw=(W-lw-rw)*r.min/max;
    const name = r.label.length>9 ? r.label.slice(0,8)+'…' : r.label;
    svg.append(
      s('text',{x:lw-10, y:y+19, 'text-anchor':'end', class:'lbl'}, name),
      s('rect',{x:lw, y:y+5, width:Math.max(bw,2), height:20, rx:4, fill:r.color}, s('title',{}, `${r.label} ${fmtDur(r.min)}`)),
      s('text',{x:lw+bw+8, y:y+19, class:'val'}, fmtDur(r.min)));
  });
  return svg;
}

function makeReport(ds){
  const es=dayEntries(ds,true), work=es.filter(e=>!cat(e.cat).exclude);
  const lines=[`【日報】${fmtDateJ(ds)}`,''];
  if(es.length){
    const first=Math.min(...es.map(e=>e.start)), last=Math.max(...es.map(e=>e.end));
    lines.push(`業務時間：${fmtTime(first)}〜${fmtTime(last)}（実働 ${fmtDur(workMin(es))}）`,'');
  }
  lines.push('■ 本日の実績');
  if(!work.length) lines.push('・（記録なし）');
  const order=[...totalsFor(work).entries()].sort((a,b)=>b[1]-a[1]);
  for(const [id,min] of order){
    lines.push(`・${cat(id).name}（${fmtDur(min)}）`);
    const memos=new Map();
    for(const e of work) if(e.cat===id){ const k=(e.memo||'').trim(); if(k) memos.set(k,(memos.get(k)||0)+durMin(e)); }
    for(const [k,m] of memos) lines.push(`　- ${k}（${fmtDur(m)}）`);
  }
  lines.push('','■ 明日の予定','・','','■ 所感・共有事項','・');
  return lines.join('\n');
}

/* ===== 入力ダイアログ ===== */
function openEntryDialog(e){
  const isNew=!e;
  const ds = e ? dateStr(new Date(e.start)) : view.date;
  const today = ds===todayStr();
  const sel=h('select',{}, state.categories.map(c=>h('option',{value:c.id, selected: e ? e.cat===c.id : false}, c.name)));
  if(e && !state.categories.some(c=>c.id===e.cat)) sel.append(h('option',{value:e.cat, selected:true},'（削除した業務）'));
  const date=h('input',{type:'date', value:ds, required:true});
  const st=h('input',{type:'time', required:true, value: e ? fmtTime(e.start) : (today ? fmtTime(Date.now()-3600e3) : '09:00')});
  const en=h('input',{type:'time', required:true, value: e ? fmtTime(e.end) : (today ? fmtTime(Date.now()) : '10:00')});
  const memo=h('input',{type:'text', maxlength:'200', placeholder:'内容（任意）', value: e ? e.memo : ''});
  const err=h('p',{class:'warn', hidden:true});
  const dlg=h('dialog',{},
    h('h3',{}, isNew?'記録を追加':'記録を編集'),
    h('label',{class:'field'}, h('span',{},'業務'), sel),
    h('label',{class:'field'}, h('span',{},'日付'), date),
    h('div',{class:'row'},
      h('label',{class:'field grow'}, h('span',{},'開始'), st),
      h('label',{class:'field grow'}, h('span',{},'終了'), en)),
    h('label',{class:'field'}, h('span',{},'メモ'), memo),
    err,
    h('div',{class:'dlgbtns'},
      isNew ? null : h('button',{class:'btn danger left', onclick:()=>{
        if(!confirm('この記録を削除しますか？')) return;
        state.entries=state.entries.filter(x=>x.id!==e.id); save(); dlg.close(); render(); toast('削除しました');
      }},'削除'),
      h('button',{class:'btn', onclick:()=>dlg.close()},'キャンセル'),
      h('button',{class:'btn primary', onclick:()=>{
        if(!date.value || !st.value || !en.value){ err.textContent='日付・開始・終了を入力してください'; err.hidden=false; return; }
        const base=parseDate(date.value);
        const [sh,sm]=st.value.split(':').map(Number), [eh,em]=en.value.split(':').map(Number);
        const start=new Date(base.getFullYear(),base.getMonth(),base.getDate(),sh,sm).getTime();
        const end=new Date(base.getFullYear(),base.getMonth(),base.getDate(),eh,em).getTime();
        if(end<=start){ err.textContent='終了は開始より後の時刻にしてください（日付をまたぐ場合は2件に分けてください）'; err.hidden=false; return; }
        if(isNew) state.entries.push({id:uid(), cat:sel.value, start, end, memo:memo.value.trim()});
        else Object.assign(state.entries.find(x=>x.id===e.id), {cat:sel.value, start, end, memo:memo.value.trim()});
        save(); dlg.close(); view.date=date.value; render(); toast('保存しました');
      }},'保存')));
  dlg.addEventListener('close',()=>dlg.remove());
  document.body.append(dlg); dlg.showModal();
}

/* ===== 集計 ===== */
function periodRange(){
  const t=parseDate(todayStr()); const days=[];
  if(view.period==='week'){
    const start=new Date(t); start.setDate(t.getDate()-((t.getDay()+6)%7)+view.offset*7);
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(dateStr(d)); }
    return {days, label:`${fmtMD(days[0])}（月）〜${fmtMD(days[6])}（日）`};
  }
  const start=new Date(t.getFullYear(), t.getMonth()+view.offset, 1);
  const n=new Date(start.getFullYear(), start.getMonth()+1, 0).getDate();
  for(let i=1;i<=n;i++) days.push(dateStr(new Date(start.getFullYear(), start.getMonth(), i)));
  return {days, label:`${start.getFullYear()}年${start.getMonth()+1}月`};
}

function renderStats(){
  const f=document.createDocumentFragment();
  const {days,label}=periodRange();
  const entries=days.flatMap(ds=>dayEntries(ds,true));
  const setP=p=>{view.period=p; view.offset=0; render();};
  f.append(h('div',{class:'datenav'},
    h('div',{class:'seg'},
      h('button',{'aria-pressed':String(view.period==='week'), onclick:()=>setP('week')},'週'),
      h('button',{'aria-pressed':String(view.period==='month'), onclick:()=>setP('month')},'月')),
    h('button',{class:'btn icon','aria-label':'前へ', onclick:()=>{view.offset--; render();}},'◀'),
    h('strong',{class:'datelabel'}, label),
    h('button',{class:'btn icon','aria-label':'次へ', onclick:()=>{view.offset++; render();}},'▶'),
    view.offset ? h('button',{class:'btn', onclick:()=>{view.offset=0; render();}},'今に戻る') : null));

  const workDays=days.filter(ds=>workMin(dayEntries(ds,true))>0).length;
  const total=workMin(entries);
  f.append(h('section',{class:'card'},
    h('h2',{},'日ごとの実働時間'),
    h('p',{class:'total'}, `実働 ${fmtDur(total)}`, h('span',{class:'muted', style:'font-size:14px;font-weight:400'}, workDays ? `　（記録のある日 ${workDays}日・1日平均 ${fmtDur(total/workDays)}）` : '')),
    entries.length ? stackChart(days) : h('p',{class:'empty'},'この期間の記録はありません。')));

  const totals=[...totalsFor(entries).entries()].sort((a,b)=>catIndex(a[0])-catIndex(b[0]));
  const allMin=entries.reduce((a,e)=>a+durMin(e),0);
  const tbl=h('table',{class:'sum'}, h('thead',{}, h('tr',{}, h('th',{},'業務'), h('th',{style:'text-align:right'},'時間'), h('th',{style:'text-align:right'},'割合'))));
  const tb=h('tbody',{});
  for(const [id,min] of totals){
    const c=cat(id);
    tb.append(h('tr',{}, h('td',{}, h('span',{class:'chip', style:`--c:${c.color}`}, c.name), c.exclude?h('span',{class:'muted', style:'font-size:12px'},'　合計に含めない'):null),
      h('td',{class:'num'}, fmtDur(min)), h('td',{class:'num'}, allMin ? Math.round(min/allMin*100)+'%' : '-')));
  }
  tbl.append(tb);
  f.append(h('section',{class:'card'},
    h('div',{class:'cardhead'}, h('h2',{},'業務ごとの内訳'),
      h('button',{class:'btn', onclick:()=>exportCSV(days)},'この期間をCSVで保存')),
    totals.length ? tbl : h('p',{class:'empty'},'この期間の記録はありません。'),
    h('p',{class:'hint', style:'margin-top:10px'},'CSVはExcelでそのまま開けます（文字化けしない形式）。工数報告などにご利用ください。')));
  return f;
}

function stackChart(days){
  const W=640, H=230, L=40, B=28, T=10, plotH=H-B-T, plotW=W-L-8;
  const per=days.map(ds=>{ const m=totalsFor(dayEntries(ds,true).filter(e=>!cat(e.cat).exclude)); return {ds, m, sum:[...m.values()].reduce((a,b)=>a+b,0)}; });
  const hours=Math.max(1, Math.ceil(Math.max(...per.map(p=>p.sum))/60));
  const step=hours>8?2:1, topH=Math.ceil(hours/step)*step;
  const yOf=min=>T+plotH-(min/(topH*60))*plotH;
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`, class:'chart', role:'img', 'aria-label':'日ごとの実働時間'});
  for(let hr=0; hr<=topH; hr+=step){
    const y=yOf(hr*60);
    svg.append(s('line',{x1:L, x2:W-8, y1:y, y2:y, class:'grid'}), s('text',{x:L-6, y:y+4, 'text-anchor':'end', class:'axis'}, hr+'h'));
  }
  const bw=plotW/days.length, labelEvery = days.length>7 ? (days.length>20?5:2) : 1;
  per.forEach((p,i)=>{
    const x=L+i*bw+bw*0.18, w=bw*0.64; let y=yOf(0);
    const keys=[...p.m.keys()].sort((a,b)=>catIndex(a)-catIndex(b));
    for(const id of keys){
      const v=p.m.get(id), hh=v/(topH*60)*plotH; y-=hh;
      svg.append(s('rect',{x, y, width:w, height:Math.max(hh,0), fill:cat(id).color}, s('title',{}, `${fmtMD(p.ds)} ${cat(id).name} ${fmtDur(v)}`)));
    }
    const d=parseDate(p.ds);
    if(i%labelEvery===0 || days.length<=7){
      const lbl = days.length<=7 ? `${fmtMD(p.ds)}(${WD[d.getDay()]})` : String(d.getDate());
      svg.append(s('text',{x:x+w/2, y:H-8, 'text-anchor':'middle', class:'axis'}, lbl));
    }
  });
  return svg;
}

function csvCell(v){
  v=String(v);
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v;               // Excelの数式として実行されないように
  return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function exportCSV(days){
  const set=new Set(days);
  const rows=[['日付','開始','終了','業務','メモ','時間（分）','実働に含める']];
  state.entries.filter(e=>set.has(dateStr(new Date(e.start)))).sort((a,b)=>a.start-b.start).forEach(e=>{
    const c=cat(e.cat);
    rows.push([dateStr(new Date(e.start)), fmtTime(e.start), fmtTime(e.end), c.name, e.memo||'', Math.round(durMin(e)), c.exclude?'いいえ':'はい']);
  });
  if(rows.length===1){ toast('この期間の記録はありません'); return; }
  download(`業務ログ_${days[0]}_${days.at(-1)}.csv`, '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ===== 設定 ===== */
function renderSettings(){
  const f=document.createDocumentFragment();
  const cats=h('section',{class:'card'}, h('div',{class:'cardhead'}, h('h2',{},'業務の種類'),
    h('button',{class:'btn', onclick:()=>{
      const used=new Set(state.categories.map(c=>c.color));
      state.categories.push({id:uid(), name:'新しい業務', color:PALETTE.find(p=>!used.has(p))||PALETTE[0], exclude:false});
      save(); render();
    }},'＋ 追加')),
    h('p',{class:'hint'},'名前・色は変えるとすぐ保存されます。上から9個までが数字キー（1〜9）に対応します。'));
  state.categories.forEach((c,i)=>{
    const usedCount=state.entries.filter(e=>e.cat===c.id).length + (state.running&&state.running.cat===c.id?1:0);
    cats.append(h('div',{class:'catedit'},
      h('input',{type:'color', value:c.color, 'aria-label':'色', onchange:e=>{c.color=e.target.value; save();}}),
      h('input',{type:'text', maxlength:'40', value:c.name, 'aria-label':'業務名', onchange:e=>{c.name=e.target.value.trim()||'無題'; save();}}),
      h('label',{}, h('input',{type:'checkbox', checked:c.exclude, onchange:e=>{c.exclude=e.target.checked; save();}}), ' 実働に含めない'),
      h('div',{class:'row'},
        h('button',{class:'btn small', 'aria-label':'上へ', disabled: i===0, onclick:()=>{ const a=state.categories; [a[i-1],a[i]]=[a[i],a[i-1]]; save(); render(); }},'↑'),
        h('button',{class:'btn small danger', onclick:()=>{
          if(usedCount){ alert(`「${c.name}」は ${usedCount} 件の記録で使われているため削除できません。名前を変えて使ってください。`); return; }
          if(!confirm(`「${c.name}」を削除しますか？`)) return;
          state.categories=state.categories.filter(x=>x.id!==c.id); save(); render();
        }},'削除'))));
  });
  f.append(cats);

  const fileIn=h('input',{type:'file', accept:'.json,application/json', hidden:true, onchange:async e=>{
    const file=e.target.files[0]; e.target.value=''; if(!file) return;
    try{
      const data=sanitize(JSON.parse(await file.text()));
      if(!data) throw new Error('bad');
      if(!confirm(`バックアップ（記録 ${data.entries.length} 件）を読み込みます。今のデータは置き換わります。よろしいですか？`)) return;
      state=data; save(); render(); toast('読み込みました');
    }catch(err){ alert('このファイルは読み込めませんでした。このツールで書き出したバックアップを選んでください。'); }
  }});
  f.append(h('section',{class:'card'}, h('h2',{},'データの保存と移行'),
    h('p',{class:'hint'},'データはこのブラウザの中だけに保存されています。ブラウザの履歴・データを消すと記録も消えるため、ときどきバックアップを書き出してください。別のPCへ移すときも、このファイルを使います。'),
    h('div',{class:'row'},
      h('button',{class:'btn primary', onclick:()=>download(`業務ログ_バックアップ_${todayStr()}.json`, JSON.stringify(state,null,1), 'application/json')},'バックアップを書き出す'),
      h('button',{class:'btn', onclick:()=>fileIn.click()},'バックアップを読み込む'), fileIn,
      h('button',{class:'btn danger', onclick:()=>{
        if(!confirm('すべての記録と設定を削除します。元に戻せません。よろしいですか？')) return;
        if(!confirm('本当に削除しますか？（バックアップを書き出していない場合はキャンセルしてください）')) return;
        state=freshState(); save(); render(); toast('削除しました');
      }},'すべて削除'))));

  f.append(h('section',{class:'card'}, h('h2',{},'セキュリティについて'),
    h('p',{}, 'このページは、外部のサーバーと一切通信しない設定（Content Security Policy）にしています。記録した内容がインターネットやAIに送られることはありません。'),
    h('p',{class:'hint'}, 'より安心して使いたい場合は、このHTMLファイルをPCに保存し、ネットにつながっていない状態で開いても同じように動きます。')));
  return f;
}

/* ===== 起動 ===== */
function tick(){
  const r=state.running;
  if(!r){ document.title='きょうの業務ログ'; return; }
  const el=document.getElementById('elapsed'); if(el) el.textContent=fmtElapsed(Date.now()-r.start);
  const tt=document.getElementById('daytotal'); if(tt) tt.textContent=fmtDur(workMin(dayEntries(view.date,true)));
  document.title=`● ${cat(r.cat).name} ${fmtElapsed(Date.now()-r.start)}`;
}
setInterval(tick,1000);

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ view.tab=t.dataset.tab; render(); }));
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey||view.tab!=='today') return;
  if(ev.target.closest && ev.target.closest('input,textarea,select,dialog')) return;
  if(/^[1-9]$/.test(ev.key)){ const c=state.categories[Number(ev.key)-1]; if(c){ ev.preventDefault(); startCat(c.id); } }
  else if(ev.key==='0' && state.running){ ev.preventDefault(); stopRunning(); }
});
// 別のタブで開いていても内容をそろえる
window.addEventListener('storage',ev=>{ if(ev.key===STORE_KEY){ state=load(); render(); } });

const foot=document.getElementById('foot');
foot.append(`きょうの業務ログ v${VERSION}　外部通信なし・データはこの端末のみ`);
if(PROMO.url && /^https:\/\//.test(PROMO.url)) foot.append('　', h('a',{href:PROMO.url, target:'_blank', rel:'noopener noreferrer'}, PROMO.label));

render();
})();
